# ==============================================================================
# 檔案用途：GitHub Actions 排程設定檔
# ==============================================================================
# 這個檔案必須放在專案的 .github/workflows/ 資料夾底下，檔名可以自訂（副檔名要是 .yml）。
# GitHub 只要偵測到這個路徑下有 .yml 檔，就會自動讀取並依照裡面設定的規則執行。
#
# 這個工作流程做的事情：
# 1. 每天固定時間自動啟動一台雲端虛擬機器（免費，GitHub 提供）
# 2. 把你的專案程式碼下載到這台虛擬機器上
# 3. 安裝 Python、Robot Framework、SeleniumLibrary、Chrome 瀏覽器
# 4. 用無頭模式執行你的測試（tests/udemy_tests.robot）
# 5. 不管測試成功或失敗，都把 log.html / report.html / 截圖保存起來，方便你事後查看
# 6. 如果測試失敗，自動寄一封 Email 通知你
# ==============================================================================

name: Udemy每日自動化測試

# ------------------------------------------------------------------------
# on：決定這個工作流程「什麼時候」會被觸發
# ------------------------------------------------------------------------
on:
  # schedule：用 cron 語法設定固定時間執行，這是排程的核心設定
  schedule:
    # cron 語法格式：分 時 日 月 星期，這裡設定的是「每天 UTC 時間 01:00」執行
    # 【重要】GitHub Actions 的排程時間是 UTC 時區，台灣是 UTC+8，
    # 所以 UTC 01:00 等於台灣時間早上 09:00。
    # 如果你想改成別的時間，例如台灣時間晚上 22:00，
    # 換算方式：22:00（台灣）- 8 小時 = 14:00（UTC），cron 就要寫成 '0 14 * * *'
    - cron: '0 1 * * *'

  # workflow_dispatch：讓你可以在 GitHub 網頁上手動點按鈕立刻觸發一次執行，
  # 不用等到排程時間，方便你隨時手動測試這個流程有沒有設定正確
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # 定義一個叫做 run-tests 的工作
  # ------------------------------------------------------------------------
  run-tests:
    # runs-on：指定要用哪一種雲端虛擬機器，ubuntu-latest 是最常見、免費額度最高的選擇
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------------------
      # 步驟一：把你 GitHub 上的程式碼下載到這台雲端虛擬機器裡
      # --------------------------------------------------------------------
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # 步驟二：安裝 Python 環境
      # --------------------------------------------------------------------
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --------------------------------------------------------------------
      # 步驟三：安裝 Chrome 瀏覽器（雲端虛擬機器預設沒有裝瀏覽器）
      # --------------------------------------------------------------------
      - name: 安裝 Chrome 瀏覽器
        uses: browser-actions/setup-chrome@v1

      # --------------------------------------------------------------------
      # 步驟四：安裝 Robot Framework 相關套件
      # --------------------------------------------------------------------
      - name: 安裝 Robot Framework 套件
        run: |
          pip install robotframework
          pip install robotframework-seleniumlibrary

      # --------------------------------------------------------------------
      # 步驟五：正式執行測試
      # --------------------------------------------------------------------
      # continue-on-error: true 的意思是：就算這個步驟測試失敗，
      # 也讓整個流程「繼續往下走」，而不是直接中斷。
      # 這樣才能確保後面「上傳截圖」「寄失敗通知信」這些步驟一定會被執行到。
      - name: 執行 Robot Framework 測試
        id: robot_test
        continue-on-error: true
        run: |
          robot --outputdir results tests/udemy_tests.robot

      # --------------------------------------------------------------------
      # 步驟六：不管成功或失敗，都把測試產生的報告和截圖保存起來
      # --------------------------------------------------------------------
      # if: always() 代表這個步驟「不管前面測試成功還是失敗，都一定要執行」
      # upload-artifact 會把指定的檔案打包，之後你可以在 GitHub 網頁上下載
      - name: 上傳測試報告與截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: results/
          retention-days: 14

      # --------------------------------------------------------------------
      # 步驟七：如果測試失敗，寄 Email 通知你
      # --------------------------------------------------------------------
      # if: steps.robot_test.outcome == 'failure' 代表「只有在上面那個測試步驟真的失敗時」才會執行這一步
      #
      # 【使用前必看】這個步驟需要你先在 GitHub 專案裡設定好「Secrets」（密鑰），
      # 也就是你的寄件信箱帳號密碼，設定方式我在下方文字說明裡會詳細講解，
      # 這裡先看程式碼結構即可，${{ secrets.XXX }} 這種寫法代表「去讀取你設定好的密鑰」
      - name: 測試失敗時寄送 Email 通知
        if: steps.robot_test.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⚠️ Udemy自動化測試失敗通知 - ${{ github.run_number }}'
          to: ${{ secrets.MAIL_TO }}
          from: Robot Framework 自動化測試
          body: |
            你好，

            今天的 Udemy 自動化測試執行失敗了。

            執行時間：${{ github.run_id }}
            詳細報告請到以下網址下載（在 Artifacts 區塊）：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            請盡快確認問題原因。
